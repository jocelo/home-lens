<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Lens Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}">
</head>
<body>
    <main class="dashboard">
        <section class="top-banner">
            <div class="marquee-track" id="marqueeTrack">
            <div class="marquee-set" id="marqueeSet">
            <div class="youtube-group">
                <img id="channelIcon0" class="channel-icon" alt="YouTube channel icon">
                <div>
                    <span class="banner-label" id="channelTitle0">Loading channel...</span>
                    <span class="banner-value" id="subscriberCount0">Loading...</span>
                    <span class="banner-label" id="channelMeta0">Subs</span>
                </div>
            </div>

            <div class="youtube-group">
                <img id="channelIcon1" class="channel-icon" alt="YouTube channel icon">
                <div>
                    <span class="banner-label" id="channelTitle1">Loading channel...</span>
                    <span class="banner-value" id="subscriberCount1">Loading...</span>
                    <span class="banner-label" id="channelMeta1">Subs</span>
                </div>
            </div>

            <div class="youtube-group">
                <img id="channelIcon2" class="channel-icon" alt="YouTube channel icon">
                <div>
                    <span class="banner-label" id="channelTitle2">Loading channel...</span>
                    <span class="banner-value" id="subscriberCount2">Loading...</span>
                    <span class="banner-label" id="channelMeta2">Subs</span>
                </div>
            </div>
            </div>
            </div>
        </section>

        <section class="calendar-panel">
            <div class="calendar-title-row">
                <h2 class="month-label" id="monthLabel">Current Month</h2>
                <div class="prev-next-month">
                    <span id="prevMonthBtn" style="font-size: 42px;"> ⏮️ </span>
                    <span id="prevWeekBtn" style="font-size: 42px;"> ⏪ </span>
                    <span id="todayBtn" style="font-size: 42px;"> 🗓️ </span>
                    <span id="nextWeekBtn" style="font-size: 42px;"> ⏩ </span>
                    <span id="nextMonthBtn" style="font-size: 42px;"> ⏭️ </span>
                </div>
                <div class="week-context" id="weekContext">
                    <button class="icon-button" id="addEventBtn" title="Add Event">➕</button>
                    <button class="icon-button" id="maiaPoopBtn" title="Maia Poop">💩</button>
                    <button class="icon-button" id="workFromHomeBtn" title="Work From Home">🏠</button>
                </div>
            </div>
            <div class="calendar-header" id="calendarHeader"></div>
            <div class="calendar-grid" id="calendarGrid"></div>
            <section class="editor-panel" id="editorPanel" aria-live="polite">
                <p class="editor-title" id="editorTitle">Select a day</p>
                <p class="editor-note">These fields are placeholders for your future daily details.</p>
                <input class="editor-input" id="editorHeadline" type="text" placeholder="Title for selected day">
                <textarea class="editor-textarea" id="editorDetails" placeholder="Details for selected day"></textarea>
            </section>
        </section>

        <section class="bottom-banner" aria-label="Bottom image banner placeholder"></section>
    </main>

    <aside class="event-drawer" id="eventDrawer" aria-hidden="true">
        <header class="event-drawer-header">
            <h3 id="eventDrawerTitle">Events</h3>
            <button class="icon-button" id="eventDrawerClose" title="Close">✖</button>
        </header>
        <div class="event-drawer-body" id="eventDrawerBody"></div>
    </aside>

    <script>
        const WEEKDAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
        const CALENDAR_ROWS = 5;
        const MATE_CON_PAULA_CHANNEL = "UCMhSbWtm7M6IfR_pi3X56XQ";
        const BARBIE_WOONZA_CHANNEL = "UC1I4VCnjt4rhKUpQFhjG85w";
        const MAIAPAULA_CHANNEL = "UCzIuIkFMCQ1uVWYQXDW_qSw";
        const dayNotes = {};
        // Event descriptions containing any of these hashtags get the icon and color
        const EVENT_CATEGORIES = [
            {
                tags: ["#switch-releases", "#vg-releases", "#videogames", "#videogame", "#vg"],
                icon: "🕹️",
                className: "calendar-event-games",
            },
            {
                tags: ["#birthdays", "#birthday", "#BD", "#bday", "#BDay", "#BDAY"],
                icon: "🍰",
                className: "calendar-event-birthday"
            },
            {
                tags: ["#doctor", "#appointment", "#checkup", "#medical"],
                icon: "🩺",
                className: "calendar-event-doctor"
            }
        ];
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        let visibleStartDate = new Date(today);
        visibleStartDate.setDate(today.getDate() - today.getDay());

        const channels = [
            MATE_CON_PAULA_CHANNEL,
            BARBIE_WOONZA_CHANNEL,
            MAIAPAULA_CHANNEL,
        ];

        function formatDateKey(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, "0");
            const day = String(date.getDate()).padStart(2, "0");
            return `${year}-${month}-${day}`;
        }

        function setCalendarMeta(startDate, endDate) {
            const monthLabel = document.getElementById("monthLabel");

            const dateFormatter = new Intl.DateTimeFormat("en-US", {
                day: "numeric",
                month: "long",
                year: "numeric"
            });

            monthLabel.textContent = `${dateFormatter.format(startDate)} - ${dateFormatter.format(endDate)}`;
        }

        function addEvent() {
            window.location.href = '/add';
        }

        function maiaPoop() {
            console.log('Maia Poop action triggered');
            // TODO: Implement Maia Poop logic
        }

        function workFromHome() {
            console.log('Work From Home action triggered');
            // TODO: Implement Work From Home logic
        }

        function updateEditor(dateKey) {
            const titleEl = document.getElementById("editorTitle");
            const headlineInput = document.getElementById("editorHeadline");
            const detailsInput = document.getElementById("editorDetails");
            const saved = dayNotes[dateKey] || { headline: "", details: "" };

            titleEl.textContent = `Details for ${dateKey}`;
            headlineInput.value = saved.headline;
            detailsInput.value = saved.details;

            headlineInput.oninput = () => {
                dayNotes[dateKey] = {
                    headline: headlineInput.value,
                    details: detailsInput.value
                };
            };

            detailsInput.oninput = () => {
                dayNotes[dateKey] = {
                    headline: headlineInput.value,
                    details: detailsInput.value
                };
            };
        }

        function selectDayCell(cell, dateKey) {
            document.querySelectorAll(".day-cell.selected").forEach((selected) => {
                selected.classList.remove("selected");
            });
            cell.classList.add("selected");
            updateEditor(dateKey);
        }

        function createCalendarHeader() {
            const header = document.getElementById("calendarHeader");
            header.innerHTML = "";
            WEEKDAYS.forEach((day) => {
                const cell = document.createElement("div");
                cell.className = "weekday";
                cell.textContent = day;
                header.appendChild(cell);
            });
        }

        function createCalendarGrid() {
            const grid = document.getElementById("calendarGrid");
            grid.innerHTML = "";
            const startOfWeek = new Date(visibleStartDate);
            startOfWeek.setHours(0, 0, 0, 0);
            const endDate = new Date(startOfWeek);
            endDate.setDate(startOfWeek.getDate() + (CALENDAR_ROWS * 7) - 1);

            setCalendarMeta(startOfWeek, endDate);

            const totalCells = CALENDAR_ROWS * 7;
            let firstSelectableCell = null;
            let firstSelectableDateKey = null;

            for (let index = 0; index < totalCells; index += 1) {
                const currentDate = new Date(startOfWeek);
                currentDate.setDate(startOfWeek.getDate() + index);
                const dayOfWeek = index % 7;
                const dateKey = formatDateKey(currentDate);

                const cell = document.createElement("div");
                cell.className = "day-cell";
                cell.dataset.date = dateKey;

                if (dayOfWeek === 0) {
                    cell.classList.add("week-start");
                    const weekTag = document.createElement("span");
                    weekTag.className = "day-week-tag";
                    weekTag.textContent = `W${Math.floor(index / 7) + 1}`;
                    cell.appendChild(weekTag);
                }

                if (dayOfWeek === 6) {
                    cell.classList.add("week-end");
                }

                if (
                    currentDate.getFullYear() === today.getFullYear() &&
                    currentDate.getMonth() === today.getMonth() &&
                    currentDate.getDate() === today.getDate()
                ) {
                    cell.classList.add("today");
                }

                const dayNumber = document.createElement("span");
                dayNumber.className = "day-number";
                dayNumber.textContent = String(currentDate.getDate());
                cell.appendChild(dayNumber);

                const content = document.createElement("div");
                content.className = "day-content-placeholder";
                cell.appendChild(content);

                if (index === 0 || currentDate.getDate() === 1) {
                    const monthOverlay = document.createElement("span");
                    monthOverlay.className = "month-watermark";
                    monthOverlay.textContent = currentDate
                        .toLocaleString("en-US", { month: "short" })
                        .slice(0, 3)
                        .toUpperCase();
                    cell.appendChild(monthOverlay);
                }

                cell.addEventListener("click", () => {
                    selectDayCell(cell, dateKey);
                });

                grid.appendChild(cell);

                if (!firstSelectableCell) {
                    firstSelectableCell = cell;
                    firstSelectableDateKey = dateKey;
                }

                if (
                    currentDate.getFullYear() === today.getFullYear() &&
                    currentDate.getMonth() === today.getMonth() &&
                    currentDate.getDate() === today.getDate()
                ) {
                    firstSelectableCell = cell;
                    firstSelectableDateKey = dateKey;
                }
            }

            if (firstSelectableCell && firstSelectableDateKey) {
                selectDayCell(firstSelectableCell, firstSelectableDateKey);
            }

            loadCalendarEvents(startOfWeek, endDate);
        }

        let calendarRequestId = 0;

        async function loadCalendarEvents(startDate, endDate) {
            const requestId = ++calendarRequestId;
            const rangeEnd = new Date(endDate);
            rangeEnd.setDate(rangeEnd.getDate() + 1);
            const params = new URLSearchParams({
                start: startDate.toISOString(),
                end: rangeEnd.toISOString()
            });

            try {
                const response = await fetch(`/api/calendar-events?${params}`);
                const payload = await response.json();
                // Ignore stale responses after the user navigated away
                if (requestId !== calendarRequestId || payload.error) {
                    return;
                }
                renderCalendarEvents(payload.events);
            } catch (error) {
                console.error("Could not load calendar events", error);
            }
        }

        let eventsByDate = {};
        let openDrawerDateKey = null;

        function formatEventTime(event) {
            if (!event.start.includes("T")) {
                return "All day";
            }
            const options = { hour: "numeric", minute: "2-digit" };
            const start = new Date(event.start).toLocaleTimeString("en-US", options);
            const end = new Date(event.end).toLocaleTimeString("en-US", options);
            return `${start} - ${end}`;
        }

        function openEventDrawer(dateKey) {
            const drawer = document.getElementById("eventDrawer");
            const body = document.getElementById("eventDrawerBody");
            document.getElementById("eventDrawerTitle").textContent = dateKey;
            body.innerHTML = "";

            (eventsByDate[dateKey] || []).forEach((event) => {
                const card = document.createElement("article");
                card.className = "event-card";

                const title = document.createElement("h4");
                title.textContent = event.summary;
                card.appendChild(title);

                const rows = [
                    ["When", formatEventTime(event)],
                    ["Where", event.location],
                    ["Details", event.description]
                ];
                rows.forEach(([label, value]) => {
                    if (!value) {
                        return;
                    }
                    const row = document.createElement("p");
                    const strong = document.createElement("strong");
                    strong.textContent = `${label}: `;
                    row.appendChild(strong);
                    row.appendChild(document.createTextNode(value));
                    card.appendChild(row);
                });

                if (event.htmlLink) {
                    const link = document.createElement("a");
                    link.href = event.htmlLink;
                    link.target = "_blank";
                    link.rel = "noopener";
                    link.textContent = "Open in Google Calendar";
                    card.appendChild(link);
                }

                body.appendChild(card);
            });

            drawer.classList.add("open");
            drawer.setAttribute("aria-hidden", "false");
            openDrawerDateKey = dateKey;
        }

        function closeEventDrawer() {
            openDrawerDateKey = null;
            const drawer = document.getElementById("eventDrawer");
            drawer.classList.remove("open");
            drawer.setAttribute("aria-hidden", "true");
        }

        function getEventCategory(event) {
            const description = (event.description || "").toLowerCase();
            return EVENT_CATEGORIES.find((category) =>
                category.tags.some((tag) => description.includes(tag))
            ) || null;
        }

        function renderCalendarEvents(events) {
            eventsByDate = {};
            document.querySelectorAll(".calendar-event").forEach((el) => el.remove());
            events.forEach((event) => {
                const isAllDay = !event.start.includes("T");
                // All-day dates are plain YYYY-MM-DD; parse as local to avoid a UTC day shift
                const start = isAllDay ? new Date(`${event.start}T00:00:00`) : new Date(event.start);
                let end = isAllDay ? new Date(`${event.end}T00:00:00`) : new Date(event.end);
                // Google's all-day end date is exclusive
                if (isAllDay || end > start) {
                    end = new Date(end.getTime() - 1);
                }

                const day = new Date(start);
                day.setHours(0, 0, 0, 0);
                while (day <= end) {
                    const dateKey = formatDateKey(day);
                    const cell = document.querySelector(`.day-cell[data-date="${dateKey}"]`);
                    if (cell) {
                        (eventsByDate[dateKey] = eventsByDate[dateKey] || []).push(event);
                        const item = document.createElement("div");
                        item.className = "calendar-event";
                        item.title = event.location ? `${event.summary} @ ${event.location}` : event.summary;
                        const category = getEventCategory(event);
                        if (category) {
                            item.classList.add(category.className);
                            item.textContent = `${category.icon} ${event.summary}`;
                        } else {
                            item.textContent = isAllDay
                                ? event.summary
                                : `${start.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" })} ${event.summary}`;
                        }
                        item.addEventListener("click", (e) => {
                            e.stopPropagation();
                            openEventDrawer(cell.dataset.date);
                        });
                        cell.querySelector(".day-content-placeholder").appendChild(item);
                    }
                    day.setDate(day.getDate() + 1);
                }
            });

            if (openDrawerDateKey) {
                openEventDrawer(openDrawerDateKey);
            }
        }

        function refreshCalendarEvents() {
            const endDate = new Date(visibleStartDate);
            endDate.setDate(visibleStartDate.getDate() + (CALENDAR_ROWS * 7) - 1);
            loadCalendarEvents(visibleStartDate, endDate);
        }

        function shiftCalendarByWeek(weekDelta) {
            visibleStartDate = new Date(visibleStartDate);
            visibleStartDate.setDate(visibleStartDate.getDate() + (weekDelta * 7));
            createCalendarGrid();
        }

        function goToTodayView() {
            visibleStartDate = new Date(today);
            visibleStartDate.setDate(today.getDate() - today.getDay());
            visibleStartDate.setHours(0, 0, 0, 0);
            createCalendarGrid();
        }

        async function loadSubscribers(channel, index) {
            const countElement = document.getElementById(`subscriberCount${index}`);
            const channelTitleElement = document.getElementById(`channelTitle${index}`);
            const channelMetaElement = document.getElementById(`channelMeta${index}`);
            const channelIconElement = document.getElementById(`channelIcon${index}`);

            try {
                const response = await fetch("/api/youtube-subscribers", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({ channel })
                });

                const payload = await response.json();
                if (payload.error) {
                    countElement.textContent = "Unavailable";
                    channelTitleElement.textContent = "Channel unavailable";
                    channelMetaElement.textContent = payload.error;
                    channelIconElement.removeAttribute("src");
                    channelIconElement.classList.add("channel-icon-fallback");
                    return;
                }

                channelTitleElement.textContent = payload.channel_name;
                channelMetaElement.textContent = "Subs";
                countElement.textContent = Number(payload.subscriber_count).toLocaleString();

                if (payload.channel_icon_url) {
                    channelIconElement.src = payload.channel_icon_url;
                    channelIconElement.classList.remove("channel-icon-fallback");
                } else {
                    channelIconElement.removeAttribute("src");
                    channelIconElement.classList.add("channel-icon-fallback");
                }
            } catch (error) {
                countElement.textContent = "Unavailable";
                channelTitleElement.textContent = "Channel unavailable";
                channelMetaElement.textContent = "Channel data could not be loaded";
                channelIconElement.removeAttribute("src");
                channelIconElement.classList.add("channel-icon-fallback");
            }
        }

        createCalendarHeader();
        createCalendarGrid();
        Promise.all(channels.slice(0, 3).map((channel, index) => loadSubscribers(channel, index)))
            .then(() => {
                // Duplicate the set so the scroll loops seamlessly
                const set = document.getElementById("marqueeSet");
                const clone = set.cloneNode(true);
                clone.removeAttribute("id");
                clone.setAttribute("aria-hidden", "true");
                clone.querySelectorAll("[id]").forEach((el) => el.removeAttribute("id"));
                document.getElementById("marqueeTrack").appendChild(clone);
            });

        document.getElementById('eventDrawerClose').addEventListener('click', closeEventDrawer);

        // Poll Google Calendar so events added elsewhere appear without a reload
        setInterval(refreshCalendarEvents, 300000);
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                refreshCalendarEvents();
            }
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                closeEventDrawer();
            }
        });

        // Attach event listeners to icon buttons
        document.getElementById('addEventBtn').addEventListener('click', addEvent);
        document.getElementById('maiaPoopBtn').addEventListener('click', maiaPoop);
        document.getElementById('workFromHomeBtn').addEventListener('click', workFromHome);

        // Week navigation controls
        document.getElementById('prevWeekBtn').addEventListener('click', () => shiftCalendarByWeek(-1));
        document.getElementById('nextWeekBtn').addEventListener('click', () => shiftCalendarByWeek(1));
        document.getElementById('todayBtn').addEventListener('click', goToTodayView);
    </script>
</body>
</html>
